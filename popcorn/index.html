<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Popcorn VTuber</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  :root {
    --bg: #00ff00;
    --panel: #1a1816;
    --panel-edge: #2b2825;
    --ink: #f3efe6;
    --muted: #9b958a;
    --butter: #f5b63f;
    --butter-deep: #c98a14;
    --font-hand: 'Gaegu', 'Noto Sans KR', sans-serif;
    --font-body: 'Noto Sans KR', 'Segoe UI', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); }

  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
  }
  #avatar {
    max-height: 92vh; max-width: 92vw;
    transform-origin: 50% 100%;
    user-select: none; -webkit-user-drag: none;
  }
  #avatar.talking { animation: bounce 0.18s ease-in-out infinite alternate; }
  @keyframes bounce {
    from { transform: translateY(0) scaleY(1); }
    to   { transform: translateY(-14px) scaleY(1.02); }
  }
  @media (prefers-reduced-motion: reduce) {
    #avatar.talking { animation: none; }
  }

  #panel {
    position: fixed; top: 14px; left: 14px;
    width: 268px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 16px 18px 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    transition: opacity 0.2s;
    display: flex; flex-direction: column; gap: 14px;
  }
  #panel.hidden { opacity: 0; pointer-events: none; }
  #panel h1 {
    font-family: var(--font-hand); font-weight: 700;
    font-size: 26px; line-height: 1; letter-spacing: -0.5px;
  }
  #panel h1 small { font-family: var(--font-body); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-left: 8px; font-weight: 500; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .row label {
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500;
  }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button.chip {
    font-family: var(--font-body); font-size: 13px;
    background: transparent; color: var(--ink);
    border: 1px solid var(--panel-edge); border-radius: 999px;
    padding: 5px 12px; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  button.chip:hover { border-color: var(--muted); }
  button.chip:focus-visible { outline: 2px solid var(--butter); outline-offset: 2px; }
  button.chip.active { background: var(--butter); color: #1a1408; border-color: var(--butter); font-weight: 500; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(255,255,255,0.25); }

  input[type=range] { width: 100%; accent-color: var(--butter); }
  #meter { height: 6px; background: var(--panel-edge); border-radius: 3px; overflow: hidden; }
  #meterFill { height: 100%; width: 0%; background: var(--butter); transition: width 0.05s linear; }

  #status { font-size: 12px; color: var(--muted); line-height: 1.5; }
  #status.warn { color: var(--butter); }
  kbd {
    font-family: var(--font-body); font-size: 11px;
    background: var(--panel-edge); border-radius: 4px; padding: 1px 5px;
  }
  #keys { font-size: 11px; color: var(--muted); line-height: 1.8; }

  #startOverlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(12,10,8,0.78);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  #startOverlay h2 { font-family: var(--font-hand); font-weight: 700; font-size: 44px; color: var(--ink); letter-spacing: -1px; text-wrap: balance; }
  #startOverlay p { color: var(--muted); font-size: 14px; }
  #startBtn {
    font-family: var(--font-body); font-size: 17px; font-weight: 500;
    background: var(--butter); color: #1a1408;
    border: none; border-radius: 999px; padding: 13px 34px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(245,182,63,0.35);
  }
  #startBtn:hover { background: #ffc552; }
  #startBtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  #skipBtn { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline; font-family: var(--font-body); }
</style>
</head>
<body>

<div id="stage"><img id="avatar" alt="팝콘 캐릭터"></div>

<div id="startOverlay">
  <h2>🍿 Popcorn VTuber</h2>
  <p>마이크 소리에 맞춰 입이 움직여요</p>
  <button id="startBtn">마이크 켜기</button>
  <button id="skipBtn">마이크 없이 보기</button>
</div>

<div id="panel" class="hidden">
  <h1>Popcorn VTuber <small>2D</small></h1>

  <div class="row">
    <label>감도</label>
    <input type="range" id="thresh" min="1" max="60" value="12" aria-label="감도">
    <div id="meter"><div id="meterFill"></div></div>
    <div id="status">마이크 대기 중</div>
  </div>

  <div class="row">
    <label>배경</label>
    <div class="btns">
      <button class="chip bgBtn active" data-bg="#00ff00"><span class="swatch" style="background:#00ff00"></span>그린</button>
      <button class="chip bgBtn" data-bg="#0000ff"><span class="swatch" style="background:#0000ff"></span>블루</button>
      <button class="chip bgBtn" data-bg="#f5f5f2"><span class="swatch" style="background:#f5f5f2"></span>화이트</button>
      <button class="chip bgBtn" data-bg="#18181b"><span class="swatch" style="background:#18181b"></span>다크</button>
    </div>
  </div>

  <div class="row">
    <label>모션</label>
    <div class="btns">
      <button class="chip" id="munchBtn">먹방 모드</button>
    </div>
  </div>

  <div id="keys">
    <kbd>H</kbd> 패널 숨기기 &nbsp; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 입 테스트 &nbsp; <kbd>0</kbd> 자동
  </div>
</div>

const avatar = document.getElementById('avatar');
const meterFill = document.getElementById('meterFill');
const threshEl = document.getElementById('thresh');
const panel = document.getElementById('panel');
const status = document.getElementById('status');
const overlay = document.getElementById('startOverlay');

avatar.src = SPRITES.idle;
Object.values(SPRITES).forEach(s => { const i = new Image(); i.src = s; });

let munchMode = false;
let munchTimer = null;
let audioLevel = 0;

function showApp() {
  overlay.remove();
  panel.classList.remove('hidden');
}

document.getElementById('startBtn').addEventListener('click', async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showApp();
    status.textContent = '이 환경에서는 마이크를 쓸 수 없어요. 1/2/3 키로 입을 테스트하거나 PC의 index.html로 열어 주세요.';
    status.classList.add('warn');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: false, noiseSuppression: true, autoGainControl: false
    }});
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.55;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const binHz = ctx.sampleRate / analyser.fftSize;
    const lo = Math.floor(85 / binHz), hi = Math.min(data.length - 1, Math.floor(4000 / binHz));

    // setInterval, not rAF: keeps running when the window is occluded (OBS capture)
    setInterval(() => {
      analyser.getByteFrequencyData(data);
      let sum = 0, n = 0;
      for (let i = lo; i <= hi; i++) { sum += data[i]; n++; }
      audioLevel = n ? sum / n : 0;
      meterFill.style.width = Math.min(100, audioLevel * 1.6) + '%';
    }, 33);

    showApp();
    status.textContent = '마이크 켜짐 · 말하면 입이 움직여요';
  } catch (e) {
    showApp();
    status.textContent = '마이크 차단됨 (' + e.name + '). 1/2/3 키로 테스트하거나 PC의 index.html로 열어 주세요.';
    status.classList.add('warn');
  }
});

document.getElementById('skipBtn').addEventListener('click', () => {
  showApp();
  status.textContent = '마이크 없이 보는 중 · 1/2/3 키로 입 테스트';
});

// mouth state machine — hold frames briefly so it doesn't flicker
let mouth = 'idle';
let lastSwap = 0;
let manualMouth = null; // 1/2/3 keys force a frame, 0 back to auto
setInterval(() => {
  if (munchMode) return;
  const ts = performance.now();
  const th = +threshEl.value;
  let want;
  if (manualMouth) want = manualMouth;
  else if (audioLevel > th * 2.2) want = 'open';
  else if (audioLevel > th) want = 'half';
  else want = 'idle';
  if (want !== mouth && ts - lastSwap > 70) {
    mouth = want; lastSwap = ts;
    avatar.src = SPRITES[mouth === 'half' ? 'talk_half' : mouth === 'open' ? 'talk_open' : 'idle'];
    avatar.classList.toggle('talking', mouth !== 'idle');
  }
}, 33);

// munch mode: alternate idle/munch like eating popcorn
document.getElementById('munchBtn').addEventListener('click', (e) => {
  munchMode = !munchMode;
  e.currentTarget.classList.toggle('active', munchMode);
  if (munchMode) {
    avatar.classList.remove('talking');
    let frame = false;
    munchTimer = setInterval(() => {
      frame = !frame;
      avatar.src = frame ? SPRITES.munch : SPRITES.idle;
    }, 420);
  } else {
    clearInterval(munchTimer);
    mouth = 'idle';
    avatar.src = SPRITES.idle;
  }
});

document.querySelectorAll('.bgBtn').forEach(b => b.addEventListener('click', () => {
  document.documentElement.style.setProperty('--bg', b.dataset.bg);
  document.querySelectorAll('.bgBtn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
}));

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key.toLowerCase() === 'h') panel.classList.toggle('hidden');
  if (e.key === '1') manualMouth = 'idle';
  if (e.key === '2') manualMouth = 'half';
  if (e.key === '3') manualMouth = 'open';
  if (e.key === '0') manualMouth = null;
});
</script>
